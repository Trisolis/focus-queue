<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Focus Queue</title>
<style>
:root{--bg:#f5f6f8;--sf:#fff;--ink:#14213d;--mut:#667085;--ac:#34548a;--acx:#fff;--hl:transparent;--hlx:#5b6472;--bd:#d3dae3;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--sf:#18212b;--ink:#e6edf3;--mut:#93a1b1;--ac:#9db8ee;--acx:#0d1830;--hl:transparent;--hlx:#a5b0bf;--bd:#2b3846;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#10161d;--sf:#18212b;--ink:#e6edf3;--mut:#93a1b1;--ac:#9db8ee;--acx:#0d1830;--hl:transparent;--hlx:#a5b0bf;--bd:#2b3846;--bad:#ff8a80}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
.top{background:var(--hl);color:var(--hlx);padding:12px 16px;font-weight:600;font-size:15px;cursor:pointer}
main{flex:1;overflow-y:auto;padding:18px 16px;max-width:560px;width:100%;margin:0 auto}
.sub{color:var(--mut);font-size:13px;margin-bottom:4px}
h1{font:600 30px/1.15 Georgia,"Times New Roman",serif;margin:0 0 14px}

.tm small{display:block;font:400 13px sans-serif;color:var(--mut);margin-top:6px}
ol{padding-left:20px;margin:8px 0}li{margin:4px 0}ol .on{font-weight:700;color:var(--ac)}
ul.ck{list-style:none;padding:0}ul.ck li{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
ul.ck label{display:flex;gap:10px;align-items:center}

.step{font-size:22px;margin:6px 0 10px}li.dn label{text-decoration:line-through;opacity:.55}
.bn button{display:block;width:100%;margin:6px 0;text-align:left}details{border-bottom:1px solid var(--bd);padding:6px 0}summary{font-weight:600;padding:6px 0}
.row select{max-width:120px;font:inherit;padding:4px}
</style></head><body>
<div id="app"></div>
<script>
const DEF=`# Starter plan. Paste your real plan in More, Plan. Lines: "== start-end | name | flags (any, night)", "m|s|r Name | cap minutes | floor step > next step", "check Name | a/b/c", "event hh:mm Name", "call hh:mm Name"
== 6:00-9:00 | Morning
check Morning basics | water/make bed/get dressed
m Exercise | 30 | get dressed and shoes on > 5 min walk > full workout
== 9:00-12:00 | Deep work
m Creative | 30 | instrument out, 10 min > 20 more min
s Study | 30
== 12:00-18:00 | Afternoon
r Optional project | 30
== 20:00-23:59 | Night | night
check Night routine | journal/plan tomorrow/read
call 12:00 Lunch call`;
const DEFM="Starting is half the battle.\nTen minutes counts. Open the thing.\nTake 10-minute breaks: stretch, relax, drink water.";
const PAUSE=6e5,BRK=6e5;let K=null;try{K=localStorage}catch(e){}
const ld=(k,d)=>{try{const v=K.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},sv=(k,v)=>{try{K.setItem(k,JSON.stringify(v))}catch(e){}};
const $=i=>document.getElementById(i),tm=s=>{const a=s.split(':');return+a[0]*60+ +a[1]};
const hm=t=>{const d=new Date(t);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};
const dk=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const mid=()=>{const d=new Date();d.setHours(0,0,0,0);return+d};
const evT=e=>mid()+(e.time+e.push*60)*6e4;
const fmt=ms=>{ms=Math.max(0,Math.round(ms/1e3));return Math.floor(ms/60)+':'+String(ms%60).padStart(2,'0')};
const dur=ms=>{const m=Math.max(0,Math.round(ms/6e4));return m>=60?Math.floor(m/60)+'h '+m%60+'m':m+'m'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function build(t){const S={date:dk(),b:[],i:[],e:[],run:null,off:null,brk:0,cut:0,pick:null};let n=0;
t.split('\n').forEach(l=>{l=l.trim();if(!l||l[0]=='#')return;
if(l.slice(0,2)=='=='){const f=l.slice(2).split('|').map(x=>x.trim()),r=f[0].split('-');S.b.push({n:f[1]||'Block',s:tm(r[0]),any:/any/.test(f[2]||''),night:/night/.test(f[2]||'')});return}
const m=l.match(/^(event|call)\s+(\d{1,2}:\d\d)\s+(.+)$/);
if(m){S.e.push({id:'e'+n++,time:tm(m[2]),name:m[3],soft:m[1]=='call',st:'p',push:0});return}
const f=l.split('|').map(x=>x.trim()),w=f[0].split(/\s+/),k=w.shift();
if(!S.b.length)S.b.push({n:'Day',s:0});
const it={id:'i'+n++,b:S.b.length-1,name:w.join(' '),tier:'s',st:'p',df:0,sp:0};
if(k=='check'){it.ck=(f[1]||'').split('/').map(x=>x.trim()).filter(Boolean);it.on=[]}
else{it.tier=k;it.cap=+f[1]||30;it.steps=(f[2]||it.name).split('>').map(x=>x.trim())}
S.i.push(it)});return S}
let plan=ld('plan',DEF),mot=ld('mot',DEFM),log=ld('log',[]),S=ld('S',null),mi=Math.floor(Math.random()*9),ui={dis:{}};
let carry=ld("carry",[]),P=build(plan);P.txt=plan;if(!S||S.date!=dk())S=mk();
const save=()=>sv('S',S);
function L(ty,nm,s,e,m,n){log.push({d:dk(),ty,nm,s:s?hm(s):'',e:e?hm(e):'',m:m||0,n:n||''});sv('log',log)}
const csv=()=>['date,type,name,start,end,minutes,note'].concat(log.map(x=>[x.d,x.ty,x.nm,x.s,x.e,x.m,x.n].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))).join('\n');
const work=()=>{const r=S.run;return r?r.acc+(r.start?Date.now()-r.start:0):0};
const itOf=id=>S.i.find(x=>x.id==id);
function cur(){if(S.run)return itOf(S.run.id);const p=S.i.filter(x=>x.st=='p');if(!p.length)return null;const b=p[0].b;
if(S.b[b].any){let k=p.find(x=>x.id==S.pick&&x.b==b);if(!k){const q=p.filter(x=>x.b==b);k=q[Math.floor(Math.random()*q.length)];S.pick=k.id}return k}return p[0]}
const evNow=()=>S.e.find(e=>e.st=='a')||S.e.filter(e=>e.st=='p'&&evT(e)<=Date.now()&&!ui.dis[e.id]).sort((a,b)=>evT(a)-evT(b))[0];
const nextEv=()=>S.e.filter(e=>e.st=='p').sort((a,b)=>evT(a)-evT(b))[0];
function pause(nl){const r=S.run;if(!r||r.p)return;r.acc+=Date.now()-r.start;r.start=0;r.p=Date.now();r.nl=!!nl}
function resume(){const r=S.run;if(!r||!r.p)return;r.p=0;r.nl=0;r.start=Date.now()}
function mvEnd(it,b){S.i.splice(S.i.indexOf(it),1);let k=-1;S.i.forEach((x,j)=>{if(x.b<=b)k=j});S.i.splice(k+1,0,it);it.b=b}
function mvStart(it,b){S.i.splice(S.i.indexOf(it),1);let k=S.i.findIndex(x=>x.b>=b);if(k<0)k=S.i.length;S.i.splice(k,0,it);it.b=b}
function endRun(res){const r=S.run,it=itOf(r.id),w=work();
L(res,it.name+(it.steps.length>1?' (step '+(r.step+1)+'/'+it.steps.length+')':''),r.began,Date.now(),Math.round(w/6e4),'');
it.sp+=w;S.run=null;S.pick=null;S.brk=Date.now()+BRK;ui.ch=0;if(res=='partial')mvEnd(it,it.b);else it.st='d'}
function parkCut(){S.cut=1;S.i.forEach(x=>{if(x.st=='p'&&x.tier!='m'&&!S.b[x.b].night&&!(S.run&&S.run.id==x.id)){x.st='k';L('parked',x.name,0,0,0,'8pm cutoff')}})}
function doSkip(){const f=ui.fr,it=itOf(f.id);if(S.run&&S.run.id==it.id)S.run=null;it.st='s';L('skip',it.name,0,0,0,f.rs);ui.fr=null}
function act0(a,d){const it=cur(),r=S.run;switch(a){
case'mot':mi++;break;
case'start':S.run={id:it.id,step:0,began:Date.now(),start:Date.now(),acc:0,p:0,nl:0};S.brk=0;break;
case'pause':pause();break;case'resume':resume();break;
case'fin':if(it.steps.length>1&&r.step<it.steps.length-1)ui.ch=1;else endRun('done');break;
case'nx':r.step++;ui.ch=0;break;case'fin2':endRun('done');break;
case'tick':{const j=+d.j,k=it.on.indexOf(j);k<0?it.on.push(j):it.on.splice(k,1)}break;
case'cdone':it.st='d';L('done',it.name,0,0,0,it.ck.length+' items');break;
case'endbrk':S.brk=0;break;
case'df':ui.df=1;break;case'dfx':ui.df=0;break;
case'dfb':case'dfn':{ui.df=0;it.df++;if(S.run&&S.run.id==it.id)S.run=null;
if(a=='dfb')mvEnd(it,it.b);else mvStart(it,it.b+1);L('defer',it.name,0,0,0,a=='dfb'?'within block':'next block')}break;
case'sk':ui.fr={k:'skip',id:it.id,i:0,rs:''};break;
case'frx':ui.fr=null;break;
case'frn':{const f=ui.fr,it2=itOf(f.id),mu=it2.tier=='m',T=mu?3:1;
if(f.i==0){f.rs=$('rs').value.trim();f.i=1;f.until=Date.now()+(mu?3e4:1e4)}
else if(f.i<T){f.i++;f.until=Date.now()+3e4}else doSkip()}break;
case'of':ui.of=1;break;case'ofx':ui.of=0;break;case'cat':ui.cat=d.v;break;
case'ofgo':S.off={cat:ui.cat||'other',note:$('on').value,start:Date.now(),intr:it?it.name:''};if(r)pause(true);ui.of=0;break;
case'ofend':{const o=S.off;L('offplan',o.cat,o.start,Date.now(),Math.round((Date.now()-o.start)/6e4),(o.note||'')+(o.intr?' (interrupted: '+o.intr+')':''));S.off=null}break;
case'ev':{const e=S.e.find(x=>x.id==d.id),v=d.v;
if(v=='h'){e.st='a';e.began=Date.now()}
else if(v=='f'){e.st='d';L('event',e.name,e.began,Date.now(),Math.round((Date.now()-e.began)/6e4),'')}
else if(v=='e'){e.st='d';L('event',e.name,0,0,0,'done early')}
else if(v=='c'){e.st='c';L('event',e.name,0,0,0,'cancelled')}
else if(v=='d'){e.st='d';L('call',e.name,0,0,0,'done')}
else if(v=='p'){e.push++;L('push',e.name,0,0,0,'pushed 1h ('+e.push+'/2)')}
else if(v=='x')ui.dis[e.id]=1}break;
case'reopen':delete ui.dis[d.id];break;
case'more':ui.more=!ui.more;break;
case'up':case'dn':{const j=+d.j,k=a=='up'?j-1:j+1;if(k>=0&&k<S.i.length){const x=S.i[j],y=S.i[k],t=x.b;x.b=y.b;y.b=t;S.i[j]=y;S.i[k]=x;L('override',x.name,0,0,0,'moved '+a)}}break;
case'rs':{const x=S.i[+d.j];x.st='p';if(S.run&&S.run.id==x.id)S.run=null;L('override',x.name,0,0,0,'reset to pending')}break;
case'rm':{const x=S.i[+d.j];if(S.run&&S.run.id==x.id)S.run=null;S.i.splice(+d.j,1);L('override',x.name,0,0,0,'removed')}break;
case'ers':{const e=S.e.find(x=>x.id==d.id);e.st='p';e.push=0;L('override',e.name,0,0,0,'event reset')}break;
case'erm':{const k=S.e.findIndex(x=>x.id==d.id);L('override',S.e[k].name,0,0,0,'event removed');S.e.splice(k,1)}break;
case'pl':plan=$('pl').value;sv('plan',plan);S=mk();ui={dis:{}};break;
case'mo':mot=$('mo').value||DEFM;sv('mot',mot);break;
case'cp':{const t=$('cv');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}try{document.execCommand('copy')}catch(e){}return}
}save();render()}
const M=()=>{const a=mot.split('\n').filter(Boolean);return a[mi%a.length]||''};
const btn=(a,t,c,x)=>`<button class="${c||''}" data-a="${a}" ${x||''}>${t}</button>`;
function runH(it){const r=S.run&&S.run.id==it.id?S.run:null;
let h=`<div class="sub">${esc(S.b[it.b].n)}${it.sp?', '+dur(it.sp)+' done so far':''}</div><h1>${esc(it.name)}</h1>`;
if(it.ck){h+='<ul class="ck">'+it.ck.map((c,j)=>`<li><label><input type="checkbox" data-a="tick" data-j="${j}" ${it.on.includes(j)?'checked':''}> ${esc(c)}</label></li>`).join('')+'</ul>';
h+=btn('cdone',it.on.length<it.ck.length?`${it.ck.length-it.on.length} left`:'Done','big',it.on.length<it.ck.length?'disabled':'')}
else{h+='<ol>'+it.steps.map((s,j)=>`<li class="${r&&r.step==j?'on':''}">${esc(s)}</li>`).join('')+'</ol><div class="tm" id="tm"></div>';
if(!r)h+=btn('start','Start','big');
else if(ui.ch)h+=btn('nx','Next: '+esc(it.steps[r.step+1]),'big')+btn('fin2','Finish goal here','');
else h+='<div class="row2">'+(r.p?btn('resume','Resume','big'):btn('pause','Pause',''))+btn('fin','Finish','big')+'</div>'}
return h+`<div class="sec">${btn('df','Defer')}${btn('sk','Skip')}${btn('of','Something else')}</div>`}
function dfH(it){const left=2-it.df,has=it.b+1<S.b.length;
return `<div class="sub">Defer</div><h1>${esc(it.name)}</h1>`+(left>0?`<p>${left} defer${left>1?'s':''} left for this goal.</p>`+btn('dfb','Later in this block','big')+(it.tier!='m'&&has?btn('dfn','Next block','big'):it.tier=='m'?'<p class="sub">Must goals can only move within their block.</p>':'')
:'<p>No defers left. Do it, or skip it.</p>')+btn('dfx','Back','')}
function frH(){const f=ui.fr,it=itOf(f.id),mu=it.tier=='m',T=mu?3:1;
if(f.i==0)return `<div class="sub">Skip for today</div><h1>${esc(it.name)}</h1><p>Why? Write a real reason.</p><textarea id="rs" rows="3">${esc(f.rs)}</textarea><button class="big" id="fn" data-a="frn" disabled>Continue</button>${btn('frx','Back to the goal','lk')}`;
const n=log.filter(x=>x.ty=='skip'&&x.nm==it.name).length;
const t=[`<p>You are about to skip <b>${esc(it.name)}</b>.</p><blockquote>${esc(f.rs)}</blockquote>`,`<p>You have skipped this ${n} time${n==1?'':'s'} before.</p><p><b>${esc(M())}</b></p>`,`<p>A minimum version still counts. Ten minutes, then you are free to stop.</p>`][f.i-1];
return `<div class="sub">Skip, step ${f.i} of ${T}</div>${t}${btn('frx','Go back and do it','big')}<button id="fn" data-a="frn" disabled></button>`}
const CATS=['admin','social media','meal','rest','travel','other'];
const ofH=()=>`<div class="sub">Something else</div><h1>What are you doing?</h1><div class="chips">${CATS.map(c=>btn('cat',c,ui.cat==c?'sel':'','data-v="'+c+'"')).join('')}</div><input type="text" id="on" placeholder="Note (optional)">${btn('ofgo','Start timer','big')}${btn('ofx','Cancel','lk')}`;
const offH=()=>`<div class="sub">Off plan${S.off.intr?', interrupted '+esc(S.off.intr):''}</div><h1>${esc(S.off.cat)}</h1><p>${esc(S.off.note||'')}</p><div class="tm" id="tm"></div>${btn('ofend','Back to the plan','big')}`;
function evH(e){const q=`<div class="sub">${e.soft?'Call':'Fixed event'}, ${hm(evT(e))}</div><h1>${esc(e.name)}</h1>`;
if(e.st=='a')return q+'<p>In progress.</p>'+btn('ev','Finished','big','data-id="'+e.id+'" data-v="f"');
const a=(v,t,c)=>btn('ev',t,c,`data-id="${e.id}" data-v="${v}"`);
return q+(e.soft?a('d','Done','big')+(e.push<2?a('p','Push back 1 hour ('+(2-e.push)+' left)',''):'')+a('c','Cancelled',''):a('h','Happening','big')+a('e','Done early','')+a('c','Cancelled',''))+btn('ev','Back to queue','lk','data-id="'+e.id+'" data-v="x"')}
const brkH=()=>`<div class="sub">Break</div><h1>Stretch, relax, drink water.</h1><div class="tm" id="tm"></div>${btn('endbrk','Start next goal','big')}`;
const doneH0=()=>`<h1>Queue clear.</h1><p>${S.i.filter(x=>x.st=='k').length} parked item(s) are in More.</p>`;
function moreH0(){const st={p:'pending',d:'done',s:'skipped',k:'parked',x:'handled'};
let h='<h2>Today</h2>'+S.i.map((x,j)=>`<div class="row"><span>${esc(x.name)}<small>${esc(S.b[x.b].n)}, ${st[x.st]}</small></span><span>${['up','dn','rs','rm'].map((a,k)=>btn(a,'↑↓↺✕'[k],'','data-j="'+j+'"')).join('')}</span></div>`).join('');
h+='<h2>Events</h2>'+S.e.map(e=>`<div class="row"><span>${esc(e.name)}<small>${hm(evT(e))}, ${{p:'pending',a:'active',d:'done',c:'cancelled'}[e.st]}</small></span><span>${btn('ers','↺','','data-id="'+e.id+'"')}${btn('erm','✕','','data-id="'+e.id+'"')}</span></div>`).join('');
h+='<h2>Parked</h2>'+(S.i.filter(x=>x.st=='k').map(x=>`<div class="row">${esc(x.name)}</div>`).join('')||'<p class="sub">Nothing parked.</p>');
h+=`<h2>Plan</h2><textarea id="pl" rows="14">${esc(plan)}</textarea>${btn('pl','Save plan and rebuild today','big')}<h2>Motivation lines</h2><textarea id="mo" rows="4">${esc(mot)}</textarea>${btn('mo','Save lines','')}<h2>Export log (CSV)</h2><textarea id="cv" rows="6" readonly>${esc(csv())}</textarea>${btn('cp','Copy CSV','big')}`;return h}
function render(){const mn=document.querySelector('main'),sc=mn?mn.scrollTop:0,e=evNow(),it=cur();let b;
if(ui.more)b=moreH();else if(ui.fr)b=frH();else if(ui.df&&it)b=dfH(it);else if(ui.of)b=ofH();else if(S.off)b=offH();else if(e)b=evH(e);
else if(S.brk>Date.now()&&!S.run)b=brkH();else if(!it)b=doneH();else b=runH(it);
$('app').innerHTML=`<div class="top" data-a="mot">${esc(M())}</div><main>${b}</main><footer><div id="bar"></div>${btn('more',ui.more?'Back':'More')}</footer>`;
document.querySelector('main').scrollTop=sc;upd()}
function upd(){const n=Date.now(),r=S.run,it=r&&itOf(r.id),t=$('tm');
if(t){if(S.off)t.textContent=fmt(n-S.off.start);else if(S.brk>n&&!r)t.textContent=fmt(S.brk-n);
else if(r){t.innerHTML=r.p?fmt(PAUSE-(n-r.p))+'<small>'+(r.nl?'paused':'paused, resumes soon')+'</small>':fmt(it.cap*6e4-work())+'<small>left of '+it.cap+' min cap</small>'}}
const bar=$('bar'),ne=nextEv();if(bar){if(!ne)bar.textContent='No more deadlines today';else{const d=evT(ne)-n;bar.className=d<=0?'due':'';
bar.innerHTML=d<=0?(ui.dis[ne.id]?`<span data-a="reopen" data-id="${ne.id}">${esc(ne.name)} is due. Open</span>`:esc(ne.name)+' is due'):esc(ne.name)+' at '+hm(evT(ne))+', in '+dur(d)}}
const f=ui.fr,fn=$('fn');if(f&&fn){if(f.i==0){const l=$('rs');fn.disabled=!l||l.value.trim().length<10}
else{const rem=Math.ceil((f.until-n)/1e3),T=itOf(f.id).tier=='m'?3:1;fn.disabled=rem>0;fn.textContent=rem>0?'Wait '+rem+'s':f.i<T?'Continue':'Confirm skip'}}}
function tick(){const n=Date.now(),r=S.run;let c=0;
if(r){if(r.p&&!r.nl&&n-r.p>PAUSE){resume();c=1}else if(!r.p&&work()>=itOf(r.id).cap*6e4){endRun('partial');c=1}}
if(!S.cut&&new Date().getHours()>=20){parkCut();c=1}
if(S.run&&!S.run.p&&evNow()){pause(true);c=1}
if(S.brk&&n>=S.brk&&!S.run){S.brk=0;c=1}
if(S.date!=dk()){S=mk();ui={dis:{}};c=1}
if(c){save();render()}else upd()}
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&!a.disabled)act(a.dataset.a,a.dataset)});
document.addEventListener('input',e=>{if(e.target.id=='rs')upd()});
if(!S.cut&&new Date().getHours()>=20)parkCut();
const tmf=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
function mk(){const s=build(plan);if(carry.length){s.b.unshift({n:'Carried over',s:0});s.i.forEach(x=>x.b++);s.i=carry.map(c=>Object.assign({},c,{id:'c'+Math.random().toString(36).slice(2),b:0,st:'p',df:0,sp:0,on:c.ck?[]:undefined})).concat(s.i);carry=[];sv('carry',carry)}return s}
function one(l,b){const f=l.split('|').map(x=>x.trim()),w=f[0].split(/\s+/),k=w.shift();const it={id:'i'+Math.random().toString(36).slice(2),b,name:w.join(' '),tier:'s',st:'p',df:0,sp:0};
if(k=='check'){it.ck=(f[1]||'').split('/').map(x=>x.trim()).filter(Boolean);it.on=[]}else{it.tier=k;it.cap=+f[1]||30;it.steps=(f[2]||it.name).split('>').map(x=>x.trim())}return it}
const toLine=x=>x.ck?'check '+x.name+' | '+x.ck.join('/'):x.tier+' '+x.name+' | '+x.cap+' | '+x.steps.join(' > ');
const toText=X=>X.b.map((b,j)=>'== '+tmf(b.s)+'-'+tmf(j+1<X.b.length?X.b[j+1].s:1439)+' | '+b.n+' | '+(b.any?'any ':'')+(b.night?'night':'')+'\n'+X.i.filter(x=>x.b==j).map(toLine).join('\n')).join('\n')+'\n'+X.e.map(e=>(e.soft?'call ':'event ')+tmf(e.time)+' '+e.name).join('\n');
function sp(j){ui.op=j;plan=toText(P);sv('plan',plan);P.txt=plan}
function pmv(it,b){P.i.splice(P.i.indexOf(it),1);let k=-1;P.i.forEach((x,j)=>{if(x.b<=b)k=j});P.i.splice(k+1,0,it);it.b=b}
function cur(){if(S.run)return itOf(S.run.id);if(S.bonus){const b=itOf(S.bonus);if(b&&b.st=='p')return b;S.bonus=null}
const p=S.i.filter(x=>x.st=='p'&&x.tier!='r');if(!p.length)return null;const b=p[0].b;
if(S.b[b].any){let k=p.find(x=>x.id==S.pick&&x.b==b);if(!k){const q=p.filter(x=>x.b==b);k=q[Math.floor(Math.random()*q.length)];S.pick=k.id}return k}return p[0]}
function endRun(res){const r=S.run,it=itOf(r.id),w=work(),n=Date.now();
L(res,it.name+(it.steps.length>1?' (part '+(r.step+1)+'/'+it.steps.length+')':''),r.began,n,Math.round(w/6e4),'');
it.sp+=w;S.run=null;S.pick=null;S.last=n;S.brk=w>=12e5?n+BRK:0;ui.ch=0;if(res=='partial')mvEnd(it,it.b);else it.st='d'}
function parkCut(){S.cut=1;S.i.forEach(x=>{if(x.st=='p'&&x.tier=='s'&&!S.b[x.b].night&&!(S.run&&S.run.id==x.id)){x.st='k';L('parked',x.name,0,0,0,'8pm cutoff')}})}
function runH(it){const r=S.run&&S.run.id==it.id?S.run:null;
let h=`<div class="sub">${esc(S.b[it.b].n)}${it.sp?', '+dur(it.sp)+' so far':''}</div><h1>${esc(it.name)}</h1>`;
if(it.ck){h+='<ul class="ck">'+it.ck.map((c,j)=>`<li class="${it.on.includes(j)?'dn':''}"><label><input type="checkbox" data-a="tick" data-j="${j}" ${it.on.includes(j)?'checked':''}> ${esc(c)}</label></li>`).join('')+'</ul>';
h+=btn('cdone',it.on.length<it.ck.length?`${it.ck.length-it.on.length} left`:'Done','big',it.on.length<it.ck.length?'disabled':'')}
else{const s=r?r.step:0,more=s<it.steps.length-1;
h+=`<p class="step">${esc(it.steps[s])}</p>`+(more&&!r?'<p class="sub">Just this part counts.</p>':'');
if(!r)h+=btn('qd','Done','big')+btn('start','Start a timer','');
else{h+='<div class="tm" id="tm"></div>';
if(ui.ch)h+=btn('fin2','Done for today','big')+btn('nx','Keep going: '+esc(it.steps[s+1]),'');
else h+='<div class="row2">'+(r.p?btn('resume','Resume','big'):btn('pause','Pause',''))+btn('fin',more?'Done with this part':'Done','big')+'</div>'}}
return h+`<div class="sec">${btn('df','Defer')}${btn('sk','Skip')}</div>`}
const bonusH=()=>{const b=S.i.filter(x=>x.tier=='r'&&x.st=='p');return b.length?'<h2>Bonus, only if you want</h2><div class="bn">'+b.map(x=>btn('bonus',esc(x.name),'','data-id="'+x.id+'"')).join('')+'</div>':''};
function doneH(){const t=log.filter(x=>x.d==dk()&&(x.ty=='done'||x.ty=='partial')),m=t.reduce((a,x)=>a+x.m,0);
return '<h1>Today you did</h1>'+t.map(x=>`<div class="row"><span>${esc(x.nm)}</span><small>${x.m?x.m+'m':''}</small></div>`).join('')+`<p>${t.length} entries, ${dur(m*6e4)} logged.</p>`+bonusH()}
function moreH(){if(P.txt!==plan){P=build(plan);P.txt=plan}
const un=S.i.map((x,j)=>[x,j]).filter(a=>a[0].st=='k'||a[0].st=='s'||(a[0].st=='p'&&a[0].tier!='r'));
let h='<h2>Plan tomorrow: unfinished</h2>'+(un.map(a=>`<div class="row"><span>${esc(a[0].name)}<small>${{p:'pending',k:'parked',s:'skipped'}[a[0].st]}</small></span><span>${btn('carry','Carry','','data-j="'+a[1]+'"')}${btn('drop','Drop','','data-j="'+a[1]+'"')}</span></div>`).join('')||'<p class="sub">Nothing unfinished.</p>')+bonusH();
h+='<h2>Edit plan blocks</h2>'+P.b.map((b,j)=>`<details ${ui.op===j?'open':''}><summary>${esc(b.n)}, ${tmf(b.s)}</summary>`+P.i.map((x,k)=>x.b!=j?'':`<div class="row"><span data-a="ged" data-k="${k}">${esc(x.name)}<small>${x.ck?'checklist':x.tier=='m'?'must':x.tier=='r'?'bonus':'should'}</small></span><span><select data-a="gmv" data-k="${k}">${P.b.map((c,m)=>`<option value="${m}" ${m==j?'selected':''}>${esc(c.n)}</option>`).join('')}</select>${btn('gdel','✕','','data-k="'+k+'"')}</span></div>`).join('')+btn('gadd','Add goal','','data-j="'+j+'"')+btn('bed','Edit block','','data-j="'+j+'"')+'</details>').join('');
return h+moreH0()+`<h2>Backup</h2><textarea id="bk" rows="4">${esc(JSON.stringify({plan,mot,log,carry,S}))}</textarea>${btn('bkcp','Copy backup','')}${btn('bkrs','Restore from pasted backup','')}`}
function act(a,d){const it=cur();switch(a){
case'qd':{const n=Date.now();L('done',it.name,S.last,n,S.last?Math.round((n-S.last)/6e4):0,'quick');it.st='d';S.last=n;S.pick=null;S.run=null;S.brk=0}break;
case'bonus':S.bonus=d.id;ui.more=0;break;
case'carry':{const x=S.i[+d.j];carry.push({name:x.name,tier:x.tier=='r'?'s':x.tier,cap:x.cap,steps:x.steps,ck:x.ck});sv('carry',carry);x.st='x';L('plan',x.name,0,0,0,'carried to tomorrow')}break;
case'drop':{const x=S.i[+d.j];x.st='x';L('plan',x.name,0,0,0,'dropped')}break;
case'ged':{const x=P.i[+d.k],l=prompt('Edit goal: m, s or r, name | cap | steps',toLine(x));if(l){const y=one(l,x.b);P.i[+d.k]=y;sp(x.b)}}break;
case'gadd':{const l=prompt('New goal: m, s or r, name | cap | steps (or: check Name | a/b/c)');if(l){P.i.push(one(l,+d.j));P.i.sort((p,q)=>p.b-q.b);sp(+d.j)}}break;
case'gdel':sp(P.i[+d.k].b);P.i.splice(+d.k,1);sp(ui.op);break;
case'bed':{const b=P.b[+d.j],l=prompt('Block: start | name | flags (any, night)',tmf(b.s)+' | '+b.n+' | '+(b.any?'any ':'')+(b.night?'night':''));if(l){const f=l.split('|').map(x=>x.trim());b.s=tm(f[0]);b.n=f[1]||b.n;b.any=/any/.test(f[2]||'');b.night=/night/.test(f[2]||'');sp(+d.j)}}break;
case'gmv':return;
case'bkcp':{const t=$('bk');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}try{document.execCommand('copy')}catch(e){}}return;
case'bkrs':{try{const o=JSON.parse($('bk').value);plan=o.plan;mot=o.mot;log=o.log;carry=o.carry||[];S=o.S||mk();sv('plan',plan);sv('mot',mot);sv('log',log);sv('carry',carry)}catch(e){alert('Could not read that backup.')}}break;
default:return act0(a,d)}save();render()}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.a=='gmv'){const v=+t.value;pmv(P.i[+t.dataset.k],v);sp(v);render()}});
function render(){const mn=document.querySelector('main'),sc=mn?mn.scrollTop:0,e=evNow(),it=cur();let b;
if(e)b=evH(e);else if(ui.more)b=moreH();else if(ui.fr)b=frH();else if(ui.df&&it)b=dfH(it);else if(S.brk>Date.now()&&!S.run)b=brkH();else if(!it)b=doneH();else b=runH(it);
$('app').innerHTML=`<div class="top" data-a="mot">${esc(M())}</div><main>${b}</main><footer><div id="bar"></div>${btn('more',ui.more?'Back':'More')}</footer>`;
document.querySelector('main').scrollTop=sc;upd()}
function tick(){const n=Date.now(),r=S.run;let c=0;
if(r){if(r.p&&!r.nl&&n-r.p>PAUSE){resume();c=1}else if(!r.p&&work()>=itOf(r.id).cap*6e4){endRun('partial');c=1}}
if(!S.cut&&new Date().getHours()>=20){parkCut();c=1}
if(S.run&&!S.run.p&&evNow()){pause(true);c=1}
const e=evNow(),id=e?e.id+e.st:'';if(id!==ui.se){ui.se=id;c=1}
if(S.brk&&n>=S.brk&&!S.run){S.brk=0;c=1}
if(S.date!=dk()){S=mk();ui={dis:{}};c=1}
if(c){save();render()}else upd()}

render();setInterval(tick,1000);
</script></body></html>
